// ---- Stimmgerät
function pitch(b,sr){let r=0;for(let i=0;i<b.length;i++)r+=b[i]*b[i];if(Math.sqrt(r/b.length)<.01)return 0;
 const N=b.length/2|0,mn=sr/1000|0,mx=sr/150|0,d=new Float32Array(mx+2);let s=0;d[0]=1;
 for(let t=1;t<=mx+1;t++){let x=0;for(let i=0;i<N;i++){const c=b[i]-b[i+t];x+=c*c}s+=x;d[t]=x*t/s}
 for(let t=mn;t<=mx;t++)if(d[t]<.15){while(t+1<=mx&&d[t+1]<d[t])t++;const a=d[t-1],c=d[t+1],p=(a-c)/(2*(a-2*d[t]+c)||1);return sr/(t+p)}return 0}
let mic,sm=0;
$('#mic').onclick=async()=>{if(mic){mic.getTracks().forEach(t=>t.stop());mic=null;$('#mic').textContent='Mikrofon starten';return}
 try{mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}catch{$('#hz').textContent='Kein Zugriff';return}
 ctx=ctx||new(window.AudioContext||webkitAudioContext)();await ctx.resume();const a=ctx.createAnalyser();a.fftSize=4096;ctx.createMediaStreamSource(mic).connect(a);
 $('#mic').textContent='Stoppen';const b=new Float32Array(4096);
 (function l(){if(!mic){$('#hz').textContent='– Hz';$('#nn').textContent='A = '+P.a4+' Hz';return}a.getFloatTimeDomainData(b);const f=pitch(b,ctx.sampleRate);
  if(f){sm=sm&&Math.abs(f/sm-1)<.06?sm*.7+f*.3:f;$('#hz').textContent=sm.toFixed(1)+' Hz';$('#nn').textContent=near(sm)}else sm=0;requestAnimationFrame(l)})()};
function refs(){$('#refs').innerHTML=BASE.map((b,i)=>{const f=tf(P.ins,i);return`<button data-f="${f}">${tn(P.ins,i)}<small>${f.toFixed(1)} Hz</small></button>`}).join('')}
let osc;$('#refs').onclick=async e=>{const b=e.target.closest('button');if(!b)return;ctx=ctx||new(window.AudioContext||webkitAudioContext)();await ctx.resume();
 const on=b.classList.contains('a');$$('#refs button').forEach(x=>x.classList.remove('a'));if(osc){osc.stop(ctx.currentTime+.05);osc=null}if(on)return;
 b.classList.add('a');const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=+b.dataset.f;g.gain.value=.25;o.connect(g);g.connect(ctx.destination);o.start();osc=o};

// ---- Metronom
let M={on:0,n:0,nx:0,id:0},taps=[];
const dots=i=>$('#dots').innerHTML=Array.from({length:+$('#beats').value},(_,k)=>`<i class="${k==i?'a':''}"></i>`).join('');
const clk=(t,a)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=a?1500:1000;g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.06)};
const setBpm=v=>{v=Math.max(30,Math.min(240,Math.round(v)));$('#bpm').value=v;$('#bpmv').textContent=v};
$('#bpm').oninput=()=>setBpm($('#bpm').value);$('#beats').onchange=()=>dots(-1);dots(-1);
$('#tap').onclick=()=>{const n=Date.now();taps=taps.filter(x=>n-x<3000);taps.push(n);if(taps.length>1)setBpm(60000/((n-taps[0])/(taps.length-1)))};
$('#mgo').onclick=async()=>{if(M.on){clearInterval(M.id);M.on=0;$('#mgo').textContent='Start';dots(-1);return}
 ctx=ctx||new(window.AudioContext||webkitAudioContext)();await ctx.resume();M.on=1;M.n=0;M.nx=ctx.currentTime+.05;$('#mgo').textContent='Stopp';
 M.id=setInterval(()=>{while(M.nx<ctx.currentTime+.12){const b=+$('#beats').value,i=M.n%b;clk(M.nx,i==0);setTimeout(()=>M.on&&dots(i),Math.max(0,(M.nx-ctx.currentTime)*1e3));M.nx+=60/$('#bpm').value;M.n++}},25)};

// ---- Griff-Tabelle
const tn=(k,i)=>P.nmo[k][i]||nm(BASE[i]+(k=='sop'?12:0)),tf=(k,i)=>P.fo[k][i]||frq(BASE[i]+(k=='sop'?12:0));
const pm=x=>{const i=BASE.indexOf(x.m-off()),f=i<0?0:P.fo[P.ins][i];return f>0?69+12*Math.log2(f/(P.a4||432)):x.m};
const near=f=>{let b=0,bd=1e9;BASE.forEach((_,i)=>{const d=Math.abs(Math.log2(f/tf(P.ins,i)));if(d<bd){bd=d;b=i}});return bd<.09?tn(P.ins,b):nm(Math.round(69+12*Math.log2(f/(P.a4||432))))};
function cfg(){let h=`<p class="mut">Ventil 3 = links, Ventil 1 = rechts. Griff z. B. 0, 1, 12, 123. Leere Felder = Standardwert.</p><label class="sl" style="max-width:10rem">Kammerton A (Hz)<input data-s="a4" type="number" step="0.1" value="${P.a4}"></label>`;
 [['sop','Sopran'],['bar','Bariton']].forEach(([k,n])=>{h+=`<h3>${n}</h3><div class="tb"><b>Ton</b><b>Hz</b><b>Griff</b>`+BASE.map((b,i)=>`<input data-k="${k}" data-i="${i}" data-r="n" value="${tn(k,i)}"><input data-k="${k}" data-i="${i}" data-r="f" type="number" step="0.1" value="${tf(k,i).toFixed(1)}"><input data-k="${k}" data-i="${i}" data-r="g" value="${P.g[k][i]}" inputmode="numeric">`).join('')+'</div>'});
 $('#cfg').innerHTML=h+`<h3>Wertung im Play-Modus</h3><div class="row"><label>Toleranz (ms)<input data-s="tol" type="number" value="${P.tol}"></label><label>Halten (%)<input data-s="hold" type="number" value="${P.hold}"></label></div><p><button id="rs">Alles zurücksetzen</button></p>`}
$('#cfg').onchange=e=>{const t=e.target,d=t.dataset;
 if(d.k){const k=d.k,i=+d.i;if(d.r=='g')t.value=P.g[k][i]=norm(t.value);else if(d.r=='n'){P.nmo[k][i]=t.value.trim();t.value=tn(k,i)}else{const v=+t.value;P.fo[k][i]=v>20?v:0;t.value=tf(k,i).toFixed(1)}}
 else if(d.s){P[d.s]=+t.value||P[d.s];if(d.s=='a4'){cfg();refs();$('#nn').textContent='A = '+P.a4+' Hz'}}save()};
$('#cfg').onclick=e=>{if(e.target.id=='rs'){P.g={bar:[...DEF],sop:[...DEF]};P.nmo={bar:Array(8).fill(''),sop:Array(8).fill('')};P.fo={bar:Array(8).fill(0),sop:Array(8).fill(0)};P.a4=432;save();cfg();refs();$('#nn').textContent='A = 432 Hz'}};
