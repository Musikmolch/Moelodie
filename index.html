<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1a2b">

<title>Mölodie</title><meta name="apple-mobile-web-app-title" content="Mölodie">
<style>
:root{--bg:#0e1a2b;--card:#17263d;--ink:#eef2f8;--mut:#8fa1ba;--gold:#f2b84b;--teal:#3dd6c3;--bad:#ff6b6b;--ok:#5be38a;color-scheme:dark;--glow:#24476f;--bg2:#070f1b;--b1:#1f3556;--b2:#15233a;--line:#2c4366;--d1:#1b2f4d;--d2:#14233a;--f1:#0b1626;--f2:#122641;--fline:#28446b;--inp:#0a1322;--knob:#26405f;--t1:#22406b;--t2:#162a47;--tline:#3a5885;--k1:#2a4469;--k2:#17283f;--go1:#5ff0dc;--go2:#22b8a6;--gotx:#05211d;--ac1:#ffd887;--ac2:#e8a22c;--actx:#241800;--sh:#0006;--lane:#111f34;--bgi:radial-gradient(130% 55% at 50% 0%,var(--glow) 0%,var(--bg) 60%,var(--bg2) 100%);--bgs:100% 100%;--bgp:0 0;--sl:auto;--fbtx:#eef2f8;--fbsh:#000;--fsh:#0009}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
button,select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.6rem .9rem}
input{background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:.4rem;width:100%}
input[type=range]{padding:0;accent-color:var(--sl)}input[type=checkbox]{width:auto}
.tab{display:none;padding:.7rem}.tab.on{display:block}
#play.on{display:flex;flex-direction:column;gap:.35rem;height:100dvh;padding-bottom:calc(.5rem + env(safe-area-inset-bottom))}
.row{display:flex;gap:.5rem;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:.5rem}
.seg .a{background:var(--gold);color:var(--actx);font-weight:700}
#score{flex:none;height:clamp(170px,26dvh,250px);overflow:auto;position:relative;background:#f6f4ee;border-radius:12px}
#fb{display:flex;justify-content:space-between;gap:.5rem;font-weight:600;min-height:1.4rem}
#fr.ok{color:var(--ok)}#fr.warn{color:var(--gold)}#fr.bad{color:var(--bad)}
#go{background:var(--teal);color:var(--gotx);border:0;font-weight:700;min-width:3.4rem}
details{background:var(--card);border-radius:12px;padding:.5rem .8rem}
.pr{display:flex;gap:.8rem;align-items:center;padding:.25rem 0;font-size:.9rem}.pr span{flex:1}
#valves{display:flex;justify-content:center;gap:.5rem;padding:.4rem 0}
#valves button{flex:1;max-width:150px;aspect-ratio:1;border-radius:50%;border:3px solid #34506f;background:radial-gradient(circle at 35% 30%,#2a4263,#16253b);color:var(--mut);font:700 1.8rem system-ui;touch-action:none;user-select:none;-webkit-user-select:none;padding:0}
#valves .on{background:radial-gradient(circle at 35% 30%,#ffd98a,#e29a1f);color:#2b1b00;border-color:#ffd98a;transform:scale(.94)}
#valves .tgt{border-color:var(--teal);box-shadow:0 0 0 4px #3dd6c355}
#fall{width:100%;position:absolute;inset:0;height:100%;display:block;background:var(--inp);border-radius:12px}
#score{cursor:pointer}
.big{font:800 4rem/1.1 system-ui;text-align:center;margin:1.2rem 0 .2rem;color:var(--gold)}
#nn,.mut{text-align:center;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.grid button,.grid label{display:flex;flex-direction:column;align-items:center;gap:.2rem;font-weight:700}
.grid small{color:var(--mut);font-weight:400}
.grid .a{background:var(--gold);color:var(--actx)}.grid .a small{color:var(--actx)}
#dots{display:flex;justify-content:center;gap:.7rem;margin:1.2rem 0}
#dots i{width:1.1rem;height:1.1rem;border-radius:50%;background:var(--knob)}#dots .a{background:var(--gold)}
h3{margin:1.2rem 0 .5rem}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--inp);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:.85rem 0;color:var(--mut);font-size:.82rem}nav .a{color:var(--gold);font-weight:700}

html{min-height:100dvh}body{min-height:100dvh;background:var(--bgi);background-repeat:no-repeat;background-attachment:fixed;background-size:var(--bgs);background-position:var(--bgp);background-color:var(--bg)}
button,select{background:linear-gradient(var(--b1),var(--b2));box-shadow:0 2px 6px var(--sh),inset 0 1px #ffffff1a}
.seg{box-shadow:inset 0 2px 6px #0007}.seg button{box-shadow:none;background:none}
.seg .a{background:linear-gradient(var(--ac1),var(--ac2));box-shadow:0 2px 6px #0007}
#go{background:linear-gradient(var(--go1),var(--go2))}
details{background:linear-gradient(var(--d1),var(--d2));box-shadow:0 3px 10px var(--sh)}
#score{background:linear-gradient(#fcf9f1,#efe9da);box-shadow:inset 0 0 0 1px #d8cfb8,0 6px 18px #0007}
#fall{background:linear-gradient(var(--f1),var(--f2));box-shadow:inset 0 0 22px var(--fsh),0 0 0 1px var(--fline)}
#valves{position:relative;padding:.2rem 0 .3rem}
#tcur{position:absolute;display:none;width:3px;margin-left:-1px;border-radius:2px;background:#e8a22c;box-shadow:0 0 8px #e8a22c;pointer-events:none;z-index:2}
#score{scrollbar-width:none}#score.tv{overflow:hidden;touch-action:none;height:clamp(100px,14dvh,128px)}#tabv{will-change:transform}#score::-webkit-scrollbar{display:none}
.seg button{padding:.45rem .2rem;font-size:.85rem}
.row>.sw{flex:none}
.sw{display:inline-flex;align-items:center;gap:.45rem;font-size:.75rem;color:var(--mut)}
.sw input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--knob);position:relative;border:0;padding:0;flex:none;transition:.2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#dfe7f2;transition:.2s}
.sw input:checked{background:var(--ac2)}.sw input:checked::after{left:21px}
#play{position:relative}
#fwrap{flex:1;min-height:120px;position:relative}
#fb{position:absolute;top:8px;left:10px;right:10px;pointer-events:none;justify-content:center;text-align:center;color:var(--fbtx);text-shadow:0 1px 4px var(--fbsh);z-index:2}
#dt{flex:none;background:none;box-shadow:none;padding:0}
#dt summary{list-style:none;cursor:pointer;background:linear-gradient(var(--b1),var(--b2));border:1px solid var(--line);border-radius:12px;padding:.5rem .7rem;font-size:.8rem;white-space:nowrap;box-shadow:0 2px 6px var(--sh)}
#dt summary::-webkit-details-marker{display:none}
.pnl{position:absolute;left:.7rem;right:.7rem;top:104px;z-index:20;background:linear-gradient(var(--d1),var(--d2));border:1px solid var(--line);border-radius:14px;padding:.7rem;box-shadow:0 12px 30px #000c;max-height:55dvh;overflow:auto}
.sl{display:flex;flex-direction:column;gap:2px;font-size:.75rem;color:var(--mut)}
.tp{display:flex;align-items:center;gap:.4rem;min-width:0}
.tp input[type=range]{flex:1;min-width:40px}.tp input[type=number]{width:3.6rem;flex:none;text-align:center}.tp small{color:var(--mut)}
.t{display:none;font-weight:400}@media(min-width:480px){.t{display:inline}}
#valves .bad{--c:#ff4d4d}
#valves button{background:none!important;box-shadow:none!important;border:0!important;border-radius:0!important;transform:none!important;aspect-ratio:1/1.4;padding:0;position:relative;color:#5a3d0c;--c:#e9b44c}
#valves i{display:block;position:absolute}
#valves .cs{left:9%;right:9%;top:50%;bottom:0;border-radius:12px 12px 16px 16px;background:linear-gradient(90deg,#7d5414,#d9a441 18%,#fff0b6 34%,#e3b24f 52%,#a9741f 78%,#6e4810);box-shadow:0 8px 14px #000a,inset 0 -6px 8px #0005}
#valves .cs::before,#valves .cs::after{content:"";position:absolute;left:-5%;right:-5%;height:13px;border-radius:7px;background:linear-gradient(90deg,#6e4810,#e9c46a 28%,#fff4c9 42%,#c9942f 70%,#6e4810);box-shadow:0 2px 4px #0007}
#valves .cs::before{top:-4px}#valves .cs::after{bottom:16%}
#valves .st{left:44%;right:44%;top:36%;height:18%;background:linear-gradient(90deg,#7b808c,#f2f4f8 45%,#6f7480);border-radius:3px;transition:transform .05s}
#valves .fb{left:20%;right:20%;top:0;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fffef8,#efe3c0 62%,#cdb98a);box-shadow:0 0 0 5px #c9942f,0 0 0 7px #6e4810,0 5px 9px #000a;display:grid;place-items:center;transition:transform .05s}
#valves .fb b{font:800 1.7rem system-ui;color:#5a3d0c}
#valves .on .fb,#valves .on .st{transform:translateY(14px)}
#valves .on .fb{background:radial-gradient(circle at 38% 32%,#fff,var(--c) 72%);box-shadow:0 0 0 5px #c9942f,0 0 0 7px #6e4810,0 0 22px var(--c)}
#valves .tgt .fb{box-shadow:0 0 0 5px var(--c),0 0 0 7px #6e4810,0 0 18px var(--c)}
#tcur{will-change:transform}
#home.on{display:flex;min-height:100dvh;align-items:center;justify-content:center}
.hm{width:100%;max-width:440px}
.logo{font:800 2.8rem system-ui;text-align:center;color:var(--gold);letter-spacing:.04em;text-shadow:0 2px 16px #e8a22c55}
.hm .mut{text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:1.8rem}
.tiles button{display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:1.7rem .5rem;font-size:1.1rem;font-weight:700;border-radius:18px;border:1px solid var(--tline);background:linear-gradient(var(--t1),var(--t2));color:var(--ink);box-shadow:0 6px 16px #0007}
.tiles span{font-size:2.3rem;line-height:1.1;color:var(--gold)}.tiles .clef{font-family:'Noto Music','Segoe UI Symbol','Apple Symbols',system-ui,sans-serif;font-weight:400}.tiles svg{color:var(--gold)}
.hd{display:flex;align-items:center;gap:.7rem;margin-bottom:.8rem}.hd b{font:800 1.2rem system-ui;letter-spacing:.05em;color:var(--gold)}
.sticker{display:block;margin:0 auto .6rem;width:min(52vw,210px);transform:rotate(-4deg);filter:drop-shadow(0 6px 10px #000a)}
#free.on{display:flex;flex-direction:column;min-height:100dvh;gap:.7rem}
#fdisp{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;min-height:120px}
#fnote{font:800 5.2rem/1 system-ui;color:var(--gold);text-shadow:0 2px 16px #e8a22c44}
#finfo{color:var(--mut);margin-top:.5rem}
#fvslot{margin-top:auto}
#zero{display:block;width:100%;margin-top:.5rem;padding:.9rem;font-size:1.1rem;font-weight:800;letter-spacing:.03em;color:#3a2705;border:0;border-radius:16px;background:linear-gradient(#f3d886,#c9942f);box-shadow:0 4px 10px #000a,inset 0 1px #fff8;touch-action:none;user-select:none;-webkit-user-select:none}
#zero.on{background:linear-gradient(#fff3c4,#e8a22c);transform:translateY(2px);box-shadow:0 0 22px #e8c46a}
.bk{padding:.5rem .75rem;line-height:0;color:var(--gold);border-color:#e8a22c99;background:linear-gradient(var(--k1),var(--k2))}
#valves button{aspect-ratio:1/.98}
#valves .vb{left:3%;right:3%;top:0;aspect-ratio:1/.78;border-radius:50%;display:grid;place-items:center;background:repeating-conic-gradient(#6f5116 0 2.4deg,#f3d886 2.4deg 4.8deg);box-shadow:0 0 0 2px #4f3810;transition:transform .05s}
#valves .vb::before{content:"";position:absolute;inset:9% 7%;border-radius:50%;background:conic-gradient(from 210deg,#f8e19a,#a07420,#f8e19a,#b58a2c,#f8e19a);box-shadow:inset 0 0 0 2px #6a4a12}
#valves .vb::after{content:"";position:absolute;inset:22% 17%;border-radius:50%;background:radial-gradient(ellipse at 36% 28%,#9a9da6 0,#44464e 36%,#17181c 78%);box-shadow:inset 0 4px 8px #000d,0 0 0 2px #856420}
#valves .vb b{position:relative;z-index:1;font:800 1.5rem system-ui;color:#e6c872;text-shadow:0 1px 2px #000}
#valves .sd{left:3%;right:3%;top:8%;aspect-ratio:1/.78;border-radius:50%;background:linear-gradient(#b58a2c,#5e4010);box-shadow:0 8px 12px #000b,0 0 0 2px #4f3810;transition:transform .05s}
#valves .sm{left:37%;right:37%;top:72%;bottom:0;border-radius:0 0 8px 8px;background:linear-gradient(90deg,#7b5a18,#f0d27c 45%,#8a6820)}
#valves .on .vb,#valves .on .sd{transform:translateY(5px)}
#valves .on .vb::after{background:radial-gradient(ellipse at 38% 30%,#fff7cf,var(--c) 58%,#a8741f);box-shadow:inset 0 2px 4px #fff6,0 0 0 2px #856420,0 0 26px var(--c)}
#valves .on .vb b{color:#3a2705;text-shadow:0 1px 0 #fff6}
#valves .tgt .vb{box-shadow:0 0 0 4px var(--c),0 0 20px var(--c)}
.tb{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:.35rem;align-items:center}.tb b{font-size:.75rem;color:var(--mut);font-weight:600}#osmdc,#tabv{position:relative}
#valves.lh{flex-direction:row-reverse}
#valves button{position:relative;z-index:1;border:0;font-size:2rem;color:var(--c);text-shadow:0 1px #fff8;box-shadow:0 8px 14px #000a,inset 0 -4px 8px #0006;background:radial-gradient(circle at 50% 42%,#fffaf0 0 33%,#e3d7b5 36% 40%,transparent 41%),conic-gradient(from 200deg,#f8dc8e,#a8741f,#f8dc8e,#b9852a,#f8dc8e)}
#valves .on{color:#1b1200;transform:translateY(5px) scale(.95);box-shadow:0 2px 6px #000a,inset 0 -2px 6px #0007,0 0 22px var(--c);background:radial-gradient(circle at 50% 42%,var(--c) 0 33%,#f3e6c0 36% 40%,transparent 41%),conic-gradient(from 200deg,#e8b94f,#7d5413,#e8b94f,#946318,#e8b94f)}
#valves .tgt{box-shadow:0 8px 14px #000a,0 0 0 4px var(--c),0 0 18px var(--c)}
#valves button{--c:#e9b44c;color:#6b4a12}

.pcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-top:.4rem}.pc{padding:.5rem;text-align:left;display:block;border-radius:16px}.pc.a{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}.pc .mini{border-radius:12px;padding:.6rem .5rem .5rem;overflow:hidden}.pc .nm{display:flex;justify-content:space-between;align-items:center;margin:.45rem .2rem .1rem;font-weight:700}.pc .nm small{display:block;font-weight:400;color:var(--mut);font-size:.75rem}
.th{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;margin:.5rem 0;padding:.7rem .9rem;font-weight:700}.th small{display:block;font-weight:400;color:var(--mut)}.th.a{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.th .pv{display:flex;align-items:center;gap:5px;padding:7px 9px;border-radius:10px;border:1px solid #8884;flex:none}.th .pv i{width:16px;height:16px;border-radius:50%;display:block}.th .ck{margin-left:auto;color:var(--gold);font-size:1.3rem}
